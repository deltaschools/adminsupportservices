<!DOCTYPE html>
<html>
<head>
    <title>Delta Teachers Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f4c81, #1e88e5);
            text-align: center;
            color: white;
        }

        .box {
            background: white;
            color: #333;
            display: inline-block;
            padding: 40px;
            margin-top: 100px;
            border-radius: 15px;
            width: 350px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-top: 15px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #1e88e5;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>

    <script>
        function checkPassword() {
            var password = document.getElementById("pass").value;

            if (password === "delta2026") {
                window.location.href = "home.html";
            } else {
                alert("Incorrect password");
            }
        }
    </script>

</head>

<body>

<div class="box">
    <h2>Delta Teachers Hub</h2>

    <p>Welcome to your dedicated teacher platform.</p>

    <p><strong>Instructions:</strong><br>
    Enter the password to unlock more information.</p>

    <input type="password" id="pass" placeholder="Enter password"><br>
    <button onclick="checkPassword()">Enter</button>
</div>

</body>
</html>
